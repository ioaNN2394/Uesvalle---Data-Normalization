# ===========================================
# Configuración de Servicios para Render
# ===========================================
# Este archivo define los servicios a desplegar en Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ==========================================
  # Web Service - Django Backend
  # ==========================================
  - type: web
    name: uesvalle-backend
    runtime: python
    region: oregon  # Puedes cambiar a: ohio, frankfurt, singapore
    plan: free      # Opciones: free, starter, standard, pro
    rootDir: uesvalle_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn uesvalle_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "uesvalle_backend.settings"
      # Base de datos - Referencia al servicio PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: uesvalle-db
          property: connectionString
      # CORS - Actualiza con tu dominio de Netlify
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tu-app.netlify.app"

  # ==========================================
  # Background Worker - Celery (Opcional)
  # ==========================================
  - type: worker
    name: uesvalle-worker
    runtime: python
    region: oregon
    plan: free
    rootDir: uesvalle_backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A uesvalle_backend worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SECRET_KEY
        fromService:
          name: uesvalle-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: uesvalle-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: uesvalle-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: uesvalle-redis
          type: redis
          property: connectionString

# ==========================================
# Databases
# ==========================================
databases:
  - name: uesvalle-db
    plan: free  # Opciones: free, starter, standard, pro
    region: oregon
    postgresMajorVersion: "15"
