[pytest]
# Configuración de pytest para el proyecto UESValle ETL

# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    slow: Tests que tardan más de 5 segundos
    integration: Tests de integración end-to-end
    unit: Tests unitarios aislados
    database: Tests que requieren base de datos
    mysql: Tests que requieren MySQL
    supabase: Tests que requieren Supabase
    api: Tests de endpoints API

# Configuración de Django
DJANGO_SETTINGS_MODULE = uesvalle_backend.settings

# Opciones adicionales
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Cobertura mínima esperada
# Se puede ejecutar: pytest --cov=apps.etl --cov-fail-under=80

# Timeout por defecto para tests lentos
# timeout = 300
